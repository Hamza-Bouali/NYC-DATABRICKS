bundle:
  name: NYC-DATABRICKS
  uuid: c3768229-1f64-430f-b2b1-58bcf8d5a95b

include:
  - resources/*.yml

variables:
  catalog:
    description: The catalog to use

  schema:
    description: The schema to use

  day:
    description: "The processing day"
    default: "01"

  month:
    description: "The processing month"
    default: "01"

  year:
    description: "The processing year"
    default: "2020"

  base_url:
    description: "Source URL for data collection"
    default: ${env.BASE_URL}

  raw_path:
    description: "Workspace landing zone path"
    default: ${env.RAW_PATH}

  warehouse_id:
    description: "SQL Warehouse ID"
    

targets:
  dev:
    mode: development
    default: true

    workspace:
      profile: dev

    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}

  prod:
    mode: production

    workspace:
      profile: prod
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: workspace
      schema: prod