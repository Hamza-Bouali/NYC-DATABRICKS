# This is a Declarative Automation Bundle definition for NYC-DATABRICKS
Public.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: NYC-DATABRICKS
Public
  uuid: c3768229-1f64-430f-b2b1-58bcf8d5a95b

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-d800dcb5-378a.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-d800dcb5-378a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/hamzabouali222@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/hamzabouali222@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: hamzabouali222@gmail.com
        level: CAN_MANAGE
