resources:
  jobs:
    download_files:
      name: get_raw_data
      tasks:
        - task_key: check_file
          notebook_task:  
            notebook_path: ../src/download_files/check_existence.ipynb
        - task_key: branching
          condition_task: 
            op: EQUAL_TO
            left: '{{ tasks.check_file.values.does_file_exist }}'
            right: 'true'
          depends_on:
            - task_key: check_file
        - task_key: download_parquet_file
          depends_on:
            - task_key: branching
              outcome: 'false'
          notebook_task:
            notebook_path: ../src/download_files/download_file.ipynb
      parameters:
        - name: month
          default: ${var.month}
        - name: year
          default: ${var.year}
        - name: base_url
          default: ${var.base_url}
        - name: raw_path
          default: ${var.raw_path}
    backfill_download:
      name: backfill_download
      tasks:
        

        - task_key: year_loop
          for_each_task:
            inputs: '["01", "02", "03", "04", "05", "06", "07", "08", "09","10","11","12"]'
            task: 
              task_key: run_job
              run_job_task: 
                job_id: ${resources.jobs.download_files.id}
                job_parameters:
                  month: "${input.month}"
                  year : "${input.year}"
                  raw_path: "${input.raw_path}"
            

      
    etl_job:
      name: etl_job
      trigger:
        pause_status: "UNPAUSED"
        file_arrival:
          url: "/Volumes/nyc_taxi/bronze/raw_data/" # Chemin UC ou Cloud Storage
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/init.ipynb
        - task_key: collect_file
          notebook_task:
            notebook_path: ../src/nyc_bronze/ingestion.ipynb
          depends_on: 
            - task_key: setup
        - task_key: test_ingestion
          depends_on: 
            - task_key: collect_file
          notebook_task:
            notebook_path: ../src/nyc_bronze/ingestion_test.ipynb
        - task_key: quarantine_duplicate_ids
          notebook_task:
            notebook_path: ../src/nyc_silver/quarantine_duplicates_id.ipynb
          depends_on: 
            - task_key: collect_file
        - task_key: quarantine_zero_miles
          notebook_task:
            notebook_path: ../src/nyc_silver/zero_miles.ipynb
          depends_on: 
            - task_key: collect_file
        - task_key: bronze_to_silver_transformation
          notebook_task: 
            notebook_path: ../src/nyc_silver/transform.ipynb
          depends_on:
            - task_key: collect_file
            - task_key: quarantine_duplicate_ids
            - task_key: quarantine_zero_miles

        - task_key: dim_zone
          depends_on: 
            - task_key: bronze_to_silver_transformation
          sql_task: 
            warehouse_id: b253792144566b85
            file: 
              path: ../src/nyc_gold/queries/gold_dim_zone.sql
        - task_key: daily_borough
          depends_on: 
            - task_key: trip_summary
          sql_task:
            warehouse_id: b253792144566b85
            file: 
              path: ../src/nyc_gold/queries/gold_daily_borough_metrics.sql

        - task_key: dim_date
          depends_on: 
            - task_key: bronze_to_silver_transformation
          sql_task:
            warehouse_id: b253792144566b85
            file: 
              path: ../src/nyc_gold/queries/gold_dim_date.sql
        
        - task_key: trip_summary
          depends_on: 
            - task_key: bronze_to_silver_transformation
            - task_key: dim_zone
            - task_key: dim_date
          sql_task:
            warehouse_id: b253792144566b85
            file: 
              path: ../src/nyc_gold/queries/gold_trip_summary.sql