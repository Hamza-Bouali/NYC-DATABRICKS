resources:
  jobs:
    download_files:
      name: get_raw_data
      tasks:
        - task_key: check_file
          notebook_task:  
            notebook_path: ../src/download_files/check_existence.ipynb
        - task_key: branching
          condition_task: 
            op: EQUAL_TO
            left: '{{ tasks.check_file.values.does_file_exist }}'
            right: 'true'
          depends_on:
            - task_key: check_file
        - task_key: download_parquet_file
          depends_on:
            - task_key: branching
              outcome: 'false'
          notebook_task:
            notebook_path: ../src/download_files/download_file.ipynb
      parameters:
        - name: month
          default: ${var.month}
        - name: year
          default: ${var.year}
        - name: base_url
          default: ${var.base_url}
        - name: raw_path
          default: ${var.raw_path}
    backfill_download:
      name: backfill_download
      tasks:
        - task_key: year_loop
          for_each_task:
            # One input object represents one month/year download.
            inputs: >-
              [
                {"month":"01","year":"2020"},{"month":"02","year":"2020"},{"month":"03","year":"2020"},{"month":"04","year":"2020"},{"month":"05","year":"2020"},{"month":"06","year":"2020"},{"month":"07","year":"2020"},{"month":"08","year":"2020"},{"month":"09","year":"2020"},{"month":"10","year":"2020"},{"month":"11","year":"2020"},{"month":"12","year":"2020"},
                {"month":"01","year":"2021"},{"month":"02","year":"2021"},{"month":"03","year":"2021"},{"month":"04","year":"2021"},{"month":"05","year":"2021"},{"month":"06","year":"2021"},{"month":"07","year":"2021"},{"month":"08","year":"2021"},{"month":"09","year":"2021"},{"month":"10","year":"2021"},{"month":"11","year":"2021"},{"month":"12","year":"2021"},
                {"month":"01","year":"2022"},{"month":"02","year":"2022"},{"month":"03","year":"2022"},{"month":"04","year":"2022"},{"month":"05","year":"2022"},{"month":"06","year":"2022"},{"month":"07","year":"2022"},{"month":"08","year":"2022"},{"month":"09","year":"2022"},{"month":"10","year":"2022"},{"month":"11","year":"2022"},{"month":"12","year":"2022"},
                {"month":"01","year":"2023"},{"month":"02","year":"2023"},{"month":"03","year":"2023"},{"month":"04","year":"2023"},{"month":"05","year":"2023"},{"month":"06","year":"2023"},{"month":"07","year":"2023"},{"month":"08","year":"2023"},{"month":"09","year":"2023"},{"month":"10","year":"2023"},{"month":"11","year":"2023"},{"month":"12","year":"2023"},
                {"month":"01","year":"2024"},{"month":"02","year":"2024"},{"month":"03","year":"2024"},{"month":"04","year":"2024"},{"month":"05","year":"2024"},{"month":"06","year":"2024"},{"month":"07","year":"2024"},{"month":"08","year":"2024"},{"month":"09","year":"2024"},{"month":"10","year":"2024"},{"month":"11","year":"2024"},{"month":"12","year":"2024"},
                {"month":"01","year":"2025"},{"month":"02","year":"2025"},{"month":"03","year":"2025"},{"month":"04","year":"2025"},{"month":"05","year":"2025"},{"month":"06","year":"2025"},{"month":"07","year":"2025"},{"month":"08","year":"2025"},{"month":"09","year":"2025"},{"month":"10","year":"2025"},{"month":"11","year":"2025"},{"month":"12","year":"2025"},
                {"month":"01","year":"2026"},{"month":"02","year":"2026"},{"month":"03","year":"2026"},{"month":"04","year":"2026"},{"month":"05","year":"2026"},{"month":"06","year":"2026"},{"month":"07","year":"2026"},{"month":"08","year":"2026"},{"month":"09","year":"2026"},{"month":"10","year":"2026"},{"month":"11","year":"2026"},{"month":"12","year":"2026"}
              ]
            task:
              task_key: run_job
              run_job_task:
                job_id: ${resources.jobs.download_files.id}
                job_parameters:
                  month: "{{input.month}}"
                  year: "{{input.year}}"
                  base_url: ${var.base_url}
                  raw_path: ${var.raw_path}

    etl_job:
      name: etl_job
      trigger:
        pause_status: "UNPAUSED"
        file_arrival:
          url: "/Volumes/nyc_taxi/bronze/raw_data/" # Chemin UC ou Cloud Storage
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/init.ipynb
        - task_key: collect_file
          notebook_task:
            notebook_path: ../src/nyc_bronze/ingestion.ipynb
          depends_on: 
            - task_key: setup
        - task_key: test_ingestion
          depends_on: 
            - task_key: collect_file
          notebook_task:
            notebook_path: ../src/nyc_bronze/ingestion_test.ipynb
        - task_key: quarantine_duplicate_ids
          notebook_task:
            notebook_path: ../src/nyc_silver/quarantine_duplicates_id.ipynb
          depends_on: 
            - task_key: collect_file
        - task_key: quarantine_zero_miles
          notebook_task:
            notebook_path: ../src/nyc_silver/zero_miles.ipynb
          depends_on: 
            - task_key: collect_file

        - task_key: augment_zone_lookup
          notebook_task:
            notebook_path: ../src/nyc_silver/data_aug.ipynb
          depends_on:
            - task_key: collect_file
        - task_key: bronze_to_silver_transformation
          notebook_task: 
            notebook_path: ../src/nyc_silver/transform.ipynb
          depends_on:
            - task_key: collect_file
            - task_key: quarantine_duplicate_ids
            - task_key: quarantine_zero_miles

        - task_key: clean_quarantined_duplicates
          notebook_task:
            notebook_path: ../src/nyc_silver/clean.ipynb
          depends_on:
            - task_key: bronze_to_silver_transformation

        - task_key: quality_check
          notebook_task:
            notebook_path: ../src/nyc_silver/quality_check.ipynb
          depends_on:
            - task_key: clean_quarantined_duplicates

        - task_key: dim_zone
          depends_on: 
            - task_key: quality_check
            - task_key: augment_zone_lookup
          sql_task: 
            warehouse_id: b253792144566b85
            file: 
              path: ../src/nyc_gold/queries/gold_dim_zone.sql
        - task_key: daily_borough
          depends_on: 
            - task_key: trip_summary
          sql_task:
            warehouse_id: b253792144566b85
            file: 
              path: ../src/nyc_gold/queries/gold_daily_borough_metrics.sql

        - task_key: dim_date
          depends_on: 
            - task_key: quality_check
          sql_task:
            warehouse_id: b253792144566b85
            file: 
              path: ../src/nyc_gold/queries/gold_dim_date.sql
        
        - task_key: trip_summary
          depends_on: 
            - task_key: quality_check
            - task_key: dim_zone
            - task_key: dim_date
          sql_task:
            warehouse_id: b253792144566b85
            file: 
              path: ../src/nyc_gold/queries/gold_trip_summary.sql